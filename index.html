<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aniversário</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#ffd6e5,#ff9ac8,#ff6fae);
  color:#fff;
  overflow-x:hidden;
  text-align:center;
}

/* CONFETE */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* CORAÇÕES FLUTUANTES */
.coracao{
  position:fixed;
  bottom:-30px;
  font-size:22px;
  opacity:.6;
  animation:subir 12s linear infinite;
}
@keyframes subir{
  to{transform:translateY(-120vh)}
}

/* PARTÍCULAS SUAVES */
.particula{
  position:fixed;
  width:4px;
  height:4px;
  background:rgba(255,255,255,.5);
  border-radius:50%;
  animation:flutuar 20s linear infinite;
}
@keyframes flutuar{
  to{transform:translateY(-120vh)}
}

/* BALÕES DISTANTES */
.balao{
  position:fixed;
  width:20px;
  height:26px;
  background:rgba(255,255,255,.15);
  border-radius:50%;
  animation:balao 25s linear infinite;
}
@keyframes balao{
  to{transform:translateY(-140vh)}
}

/* TÍTULO */
header{
  margin-top:20px;
  font-size:2.8rem;
  font-weight:bold;
  position:relative;
  z-index:1;
}

/* POLAROIDS */
.polaroids{
  position:relative;
  max-width:1200px;
  margin:20px auto;
  height:650px;
  z-index:1;
}
.polaroid{
  position:absolute;
  width:250px;
  height:410px;
  background:#fff;
  padding:12px 12px 28px;
  box-shadow:0 15px 30px rgba(0,0,0,.35);
  animation:balanco 4s ease-in-out infinite;
  overflow:hidden;
}
.polaroid::before{
  content:"";
  position:absolute;
  top:-10px;
  left:50%;
  width:80px;
  height:20px;
  background:rgba(255,255,255,.4);
  transform:translateX(-50%) rotate(-2deg);
}
.polaroid img{
  width:100%;
  height:calc(100% - 28px);
  object-fit:cover;
}
.polaroid .data{
  position:absolute;
  bottom:6px;
  width:100%;
  text-align:center;
  font-size:14px;
  color:#555;
}

/* REFLEXO */
.polaroid::after{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:60%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);
  animation:reflexo 8s infinite;
}
@keyframes reflexo{
  to{left:140%}
}

@keyframes balanco{
  0%{transform:rotate(-2deg)}
  50%{transform:rotate(2deg)}
  100%{transform:rotate(-2deg)}
}

/* POSIÇÕES */
.p1{top:20px;left:5%}
.p2{top:60px;right:5%}
.p3{top:220px;left:15%}
.p4{top:260px;right:15%}
.p5{top:120px;left:50%;transform:translateX(-50%)}

/* BOLO */
.bolo{
  position:relative;
  width:360px;
  height:420px;
  margin:20px auto;
  z-index:1;
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  justify-content: flex-end;
}
.prato{
  position:absolute;
  bottom:0;
  width:100%;
  height:20px;
  background:#eee;
  border-radius:50%;
  z-index: 10;
}
.camada{
  position:absolute;
  left:50%;
  transform: translateX(-50%);
  margin:0;
  border-radius:12px;
  opacity:0;
}
.grande{
  width:100%;
  height:80px;
  background:#ffb3c7;
  bottom: 20px;
  z-index: 9;
  animation: cair-camada 0.8s ease forwards 0.5s;
}
.media{
  width:80%;
  height:70px;
  background:#ff8fb1;
  bottom: 112px;
  z-index: 8;
  animation: cair-camada 0.8s ease forwards 1.5s;
}
.pequena{
  width:60%;
  height:60px;
  background:#ff6f91;
  bottom: 194px;
  z-index: 7;
  animation: cair-camada 0.8s ease forwards 2.5s;
}

/* RECHEIO */
.recheio {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  height: 12px;
  border-radius: 6px;
  opacity: 0;
}
.recheio-1 {
  width: 90%;
  bottom: 100px;
  z-index: 9;
  animation: cair-camada 0.8s ease forwards 1.0s;
}
.recheio-2 {
  width: 70%;
  bottom: 182px;
  z-index: 8;
  animation: cair-camada 0.8s ease forwards 2.0s;
}

@keyframes cair-camada {
  from { transform: translate(-50%, -100vh); opacity: 0; }
  to { transform: translate(-50%, 0); opacity: 1; }
}

/* VELAS */
.velas{
  position:absolute;
  bottom: 254px;
  top: auto;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:4px;
  z-index: 6;
  opacity: 0;
  animation: aparecer-velas 1s ease forwards 3.0s;
  flex-wrap: wrap;
  justify-content: center;
  width: auto;
}
@keyframes aparecer-velas { to { opacity: 1; } }

.vela{
  width:6px;
  height:26px;
  background:#fff;
  position:relative;
}
.chama{
  position:absolute;
  top:-12px;
  left:50%;
  transform:translateX(-50%);
  width:10px;
  height:14px;
  background:radial-gradient(circle,#ffd,#ff9900,#ff6600);
  border-radius:50%;
  animation:piscar .6s infinite alternate;
  transition: opacity 0.5s;
}
.chama.apagada {
  opacity: 0;
}
@keyframes piscar{
  to{transform:translateX(-50%) scale(.8)}
}

/* FUMAÇA */
.fumaca{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  animation:fuma 1.5s forwards;
}
@keyframes fuma{
  to{transform:translateY(-40px);opacity:0}
}

/* CARTÃO */
.cartao{
  max-width:360px;
  margin:40px auto;
  padding:20px;
  border-radius:16px;
  background:rgba(255,255,255,.2);
  z-index:1;
}

/* TIMELINE */
.timeline{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:30px;
}
.timeline::before{
  content:"";
  position:absolute;
  top:0;
  width:4px;
  height:0;
  background:rgba(255,255,255,.5);
  animation:linha 8s forwards;
}
@keyframes linha{
  to{height:100%}
}
.timeline .polaroid{
  position:relative;
  display:none;
  animation:entrar 1.5s ease forwards;
}

/* FITA ADESIVA NA TIMELINE */
.timeline .polaroid::before {
  background: rgba(128, 0, 128, 0.6) !important;
  transform: translateX(-50%) rotate(-3deg);
  width: 100px;
  height: 24px;
  top: -12px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

@keyframes entrar{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:none}
}
.timeline .final{
  transform:scale(1.08);
  box-shadow:0 0 35px rgba(255,255,255,.8);
}

/* ASSINATURA */
.assinatura {
  width: 100%;
  text-align: right;
  padding-right: 10px;
  margin-top: 15px;
  font-size: 1.1rem;
  font-style: italic;
  opacity: 0.9;
}

/* CAMPO DE SENHA COM EMOJI */
.input-wrapper {
  position: relative;
  display: inline-block;
  width: 100%;
  max-width: 250px;
}
.input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  z-index: 2;
  pointer-events: none;
}
#senha {
  width: 100%;
  padding: 10px 10px 10px 40px;
  border-radius: 20px;
  border: none;
  outline: none;
  font-size: 1rem;
  text-align: center;
}

/* ESTRELAS */
.estrela{
  position:fixed;
  width:6px;
  height:6px;
  background:#fff;
  border-radius:50%;
  opacity:.8;
}

/* CARTA */
.carta{
  max-width: 320px;
  margin: 20px auto;
  padding: 20px;
  background: rgba(255,255,255,.2);
  border-radius: 12px;
  text-align: left;
  font-size: 1rem;
  line-height: 1.5;
  min-height: 150px;
  white-space: pre-wrap;
}

/* CONTADOR */
.contador{
  font-size:1.2rem;
  font-weight:bold;
  margin-top:20px;
}
</style>
</head>

<body>

<canvas id="confete"></canvas>

<header>Feliz Aniversário 🎉</header>

<div class="bolo" id="bolo">
  <div class="prato"></div>
  <div class="camada grande"></div>
  <div class="recheio recheio-1"></div>
  <div class="camada media"></div>
  <div class="recheio recheio-2"></div>
  <div class="camada pequena"></div>
  
  <div class="velas">
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
    <div class="vela"><div class="chama"></div></div>
  </div>
</div>

<div class="polaroids">
  <div class="polaroid p1"><img src="foto1.jpg"></div>
  <div class="polaroid p2"><img src="foto2.jpg"></div>
  <div class="polaroid p3"><img src="foto3.jpg"></div>
  <div class="polaroid p4"><img src="foto4.jpg"></div>
  <div class="polaroid p5"><img src="foto5.jpg"></div>
</div>

<div class="cartao">
  <div class="input-wrapper">
    <span class="input-icon">💌</span>
    <input id="senha" placeholder="Senha">
  </div>

  <div id="msg" style="display:none">
    <div class="timeline" id="timeline">
      <div class="polaroid"><img src="foto_timeline1.jpg"><div class="data">2009 — 1 ano</div></div>
      <div class="polaroid"><img src="foto_timeline2.jpg"><div class="data">2010 — 3 anos</div></div>
      <div class="polaroid"><img src="foto_timeline3.jpg"><div class="data">2014 — 6 anos</div></div>
      <div class="polaroid"><img src="foto_timeline4.jpg"><div class="data">2017 — 8 anos</div></div>
      <div class="polaroid"><img src="foto_timeline5.jpg"><div class="data">2018 — 9 anos</div></div>
      <div class="polaroid final"><img src="foto_timeline6.jpg"><div class="data">2025 — 17 anos</div></div>
    </div>

    <!-- Carta aberta -->
    <div class="carta" id="carta"></div>
    
    <!-- Contador -->
    <div class="contador" id="contador"></div>

    <div class="assinatura">-com todo amor, pedro</div>
  </div>
</div>

<script>
/* CONFETE */
const canvas=document.getElementById("confete");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;canvas.height=innerHeight;
let conf=[];
for(let i=0;i<250;i++){
  conf.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,s:Math.random()*6+2,c:`hsl(${Math.random()*360},100%,60%)`,v:0.3+Math.random()});
}
function anim(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  conf.forEach(p=>{
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,p.s,p.s);
    p.y+=p.v;
    if(p.y>canvas.height){p.y=-10;p.x=Math.random()*canvas.width;}
  });
  requestAnimationFrame(anim);
}
anim();

/* CORAÇÕES */
setInterval(()=>{
  const c=document.createElement("div");
  c.className="coracao";
  c.innerText="💗","🤍";
  c.style.left=Math.random()*100+"vw";
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),12000);
},1000);

/* SENHA + TIMELINE */
document.getElementById("senha").addEventListener("input",e=>{
  if(e.target.value==="123456789"){
    msg.style.display="block";
    const fotos=document.querySelectorAll("#timeline .polaroid");
    fotos.forEach((f,i)=>setTimeout(()=>f.style.display="block",i*2500));
    setTimeout(cartaMaquina, fotos.length*2500);
  }
});

/* CARTA MAQUINA DE ESCREVER */
const cartaTexto = `Meu amor🤍,

Hoje é um dia especial, cheio de alegria e lembranças.

Que seu próximo ano seja repleto de amor, saúde e conquistas.

Com carinho,
- pedro`;
function cartaMaquina(){
  const el = document.getElementById("carta");
  let i=0;
  const intervalo = setInterval(()=>{
    el.textContent+=cartaTexto[i++];
    if(i>=cartaTexto.length) clearInterval(intervalo);
  },50);
}

/* B) LOGICA DAS VELAS (LONG PRESS) */
const velasEl = document.querySelectorAll('.chama');
let pressTimer;

function startPress() {
  pressTimer = setTimeout(apagarVelasSequencia, 2000);
}

function cancelPress() {
  clearTimeout(pressTimer);
}

document.addEventListener('mousedown', startPress);
document.addEventListener('touchstart', startPress);
document.addEventListener('mouseup', cancelPress);
document.addEventListener('touchend', cancelPress);

function apagarVelasSequencia() {
  let indices = Array.from({length: velasEl.length}, (_, i) => i);
  indices.sort(() => Math.random() - 0.5);
  indices.forEach((index, i) => {
    setTimeout(() => {
      velasEl[index].classList.add('apagada');
    }, i * 200);
  });
}

/* CONTADOR */
function atualizarContador(){
  const contador = document.getElementById("contador");
  const hoje = new Date();
  const inicio = new Date("2026-01-21T00:00:00");
  const fim = new Date("2027-01-21T00:00:00");
  let restante = fim - hoje;
  if(restante<0) restante=0;
  const dias = Math.floor(restante/1000/60/60/24);
  const horas = Math.floor((restante/1000/60/60)%24);
  const minutos = Math.floor((restante/1000/60)%60);
  const segundos = Math.floor((restante/1000)%60);
  contador.textContent = `Faltam ${dias} dias, ${horas}h ${minutos}m ${segundos}s para 21/01/2027`;
}
setInterval(atualizarContador,1000);
atualizarContador();
</script>

</body>
</html>
